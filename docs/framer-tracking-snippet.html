<!-- ==================== PART 1 — GA4 (NOT USED ON FRAMER) ==============
     Framer has a native Google Analytics field:
       Site Settings → General → Google Analytics → G-CHQEBXS4S3
     That is what is actually in use. Do NOT also add the gtag script below to
     a Framer site — two gtag loads double-count every pageview.
     Kept here only as the canonical tag for any non-Framer host.
     ==================================================================== -->
<!-- ============================ PART 1 — GA4 ============================ -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-CHQEBXS4S3"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-CHQEBXS4S3');
</script>

<!-- ==================== PART 3 — store-link tracking ====================

  Store-link tracking. Safe to paste now: the fbq call is guarded, so it does
  nothing until Part 2 is live, then starts reporting with no further edit.

  The only conversion this site has is a tap through to the App Store or Play
  Store, so it is worth measuring properly rather than relying on GA4's generic
  outbound-click event.

  Delegated from document so it survives Framer's client-side navigation —
  a listener bound to the buttons directly would go stale on the first route
  change. Uses 'pointerdown' rather than 'click' because the browser often
  tears the page down before a click handler on an outbound link can fire.
-->
<script>
  (function () {
    document.addEventListener('pointerdown', function (event) {
      var link = event.target && event.target.closest && event.target.closest('a[href]');
      if (!link) return;

      var href = link.href || '';
      var store =
        href.indexOf('apps.apple.com') > -1 ? 'app_store' :
        href.indexOf('play.google.com') > -1 ? 'play_store' : null;
      if (!store) return;

      if (typeof gtag === 'function') {
        gtag('event', 'store_link_tapped', {
          store: store,
          link_url: href,
          transport_type: 'beacon'
        });
      }
      if (typeof fbq === 'function') {
        // Custom rather than a standard event: this is intent to install, not a
        // completed install, and Meta cannot confirm the install from the web.
        fbq('trackCustom', 'StoreLinkClick', { store: store });
      }
    }, true);
  })();
</script>
